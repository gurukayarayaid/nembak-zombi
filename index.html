<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nembak Zombi</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
    <link rel="shortcut icon" href="assets/favicon.ico">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="theme-color" content="#0d141c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --p1-color: #3498db;
            --p2-color: #e74c3c;
            --accent: #f1c40f;
            --zombie-green: #50c878;
            --blood-red: #c0392b;
            --win-color: #ffd700;
        }
        
        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; touch-action: manipulation;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh; width: 100vw;
            user-select: none; -webkit-user-select: none;
        }

        /* --- MENU SCREEN --- */
        /* Di layar Android yang pendek, tombol bawah bisa melebihi layar: menu boleh digulir vertikal */
        #menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('assets/bg-city.jpeg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            z-index: 100; transition: opacity 0.5s;
            padding: 20px 10px 28px;
            overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        /* Judul utama menu */
        .title {
            font-size: clamp(3.5rem, 10vw, 6rem);
            color: var(--accent); 
            margin-top: 12vh;
            margin-bottom: 10px; text-align: center;
            text-transform: uppercase; letter-spacing: 3px; font-weight: 900;
            text-shadow: 5px 5px 0px #000, 0 0 25px rgba(241, 196, 15, 0.9);
            flex-shrink: 0;
            line-height: 1;
            z-index: 10;
        }
        .subtitle {
            font-size: 0.5em;
            color: white; text-shadow: 3px 3px 0 #000; display: block; margin-top: 10px; font-weight: 400; letter-spacing: 5px;
        }
        .rekor-menu {
            display: none;
            margin: 10px 0 0;
            padding: 6px 20px;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid rgba(241, 196, 15, 0.75);
            border-radius: 50px;
            color: var(--accent);
            font-weight: bold;
            font-size: clamp(0.85rem, 2.4vw, 1.15rem);
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
            animation: masuk 0.6s ease-out 0.3s both;
        }
        .rekor-menu.tampil { display: inline-block; }

        .menu-step {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; min-height: 100%;
            animation: fadeIn 0.5s;
            flex-grow: 1; flex-shrink: 0;
            padding: 6px 0 10px;
        }
        @keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
        @keyframes masuk {
            from { opacity: 0; transform: translateY(26px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes keluar {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-18px); }
        }
        .menu-step.keluar { animation: keluar 0.25s ease-in both !important; pointer-events: none; }
        .title { animation: masuk 0.7s ease-out both; }
        .menu-step > * { animation: masuk 0.55s ease-out both; }
        .menu-step > *:nth-child(1) { animation-delay: 0.08s; }
        .menu-step > *:nth-child(2) { animation-delay: 0.16s; }
        .menu-step > *:nth-child(3) { animation-delay: 0.24s; }
        .menu-step > *:nth-child(4) { animation-delay: 0.32s; }
        .menu-step > *:nth-child(5) { animation-delay: 0.40s; }
        .menu-step > *:nth-child(6) { animation-delay: 0.48s; }
        .menu-step > .mode-header-img { animation: masuk 0.55s ease-out both, float 3s ease-in-out 0.7s infinite; }
        @media (prefers-reduced-motion: reduce) {
            .title, .rekor-menu, .menu-step > * { animation: none !important; }
            .menu-step.keluar { animation: none !important; transition: none !important; }
            .menu-step { transition: none !important; }
        }
        .hidden { display: none !important; }

        /* HEADER IMAGE "Pilih Mode" */
        .mode-header-img {
            width: auto; height: 12vh; min-height: 60px; max-height: 150px;
            margin-bottom: 2vh; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.8));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }

        /* WADAH TOMBOL PLAYER */
        .mode-selection-container {
            display: flex; flex-direction: row; gap: 20px;
            justify-content: center; align-items: center; flex-wrap: wrap;
            width: 100%;
        }
        .mode-btn-img {
            height: 25vh; min-height: 140px; max-height: 300px; width: auto; object-fit: contain;
            cursor: pointer; transition: transform 0.2s, filter 0.2s;
            filter: drop-shadow(0 8px 5px rgba(0,0,0,0.6));
            -webkit-tap-highlight-color: transparent;
        }
        .mode-btn-img:hover { transform: scale(1.1); filter: drop-shadow(0 12px 8px rgba(0,0,0,0.7)) brightness(1.1); }
        .mode-btn-img:active { transform: scale(0.95); filter: drop-shadow(0 4px 2px rgba(0,0,0,0.5)); }

        /* WADAH DIFFICULTY (HORIZONTAL) */
        .diff-selection-container {
            display: flex; flex-direction: row; gap: 25px;
            justify-content: center; align-items: center; flex-wrap: wrap;
            width: 100%;
        }
        .diff-btn-img {
            height: 18vh; min-height: 120px; max-height: 250px; width: auto;
            cursor: pointer; transition: transform 0.2s, filter 0.2s;
            filter: drop-shadow(0 8px 5px rgba(0,0,0,0.5));
            -webkit-tap-highlight-color: transparent;
        }
        .diff-btn-img:hover { transform: scale(1.1) translateY(-5px); filter: drop-shadow(0 12px 8px rgba(0,0,0,0.6)) brightness(1.1); }
        .diff-btn-img:active { transform: scale(0.95); filter: drop-shadow(0 4px 2px rgba(0,0,0,0.5)); }

        /* PENGATURAN KECEPATAN ZOMBIE */
        .speed-group {
            display: flex; gap: 10px; align-items: center; justify-content: center;
            flex-wrap: wrap; margin-top: 4vh;
        }
        .speed-menu { margin-top: 1.2vh; margin-bottom: 0; }
        .speed-label {
            color: #eee; font-weight: bold; text-shadow: 2px 2px 0 #000;
            font-size: 1rem; letter-spacing: 1px;
        }
        .speed-btn {
            background: rgba(52, 73, 94, 0.9); color: #ddd; border: 2px solid #7f8c8d;
            border-radius: 50px; padding: 8px 22px; font-weight: bold; font-size: 0.95rem;
            cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.4); transition: 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .speed-btn:hover { border-color: var(--accent); color: #fff; }
        .speed-btn.aktif { background: var(--accent); color: #222; border-color: #fff; }

        /* Layar pendek (Android potrait): kompakkan judul & tombol agar minim scroll */
        @media (max-height: 700px) {
            .title { margin-top: 2vh; font-size: clamp(2.4rem, 9vw, 3.6rem); }
            .mode-btn-img { height: 19vh; min-height: 104px; }
            .diff-btn-img { height: 14vh; min-height: 92px; }
            .menu-step { min-height: auto; padding: 4px 0 8px; }
        }

        /* Tombol Menu Umum */
        .menu-btn {
            background: rgba(255, 255, 255, 0.95); color: #333; border: none; 
            padding: 12px 30px; margin: 10px; font-size: 1.1rem; 
            border-radius: 50px; cursor: pointer; transition: 0.2s; 
            width: auto; min-width: 150px; box-shadow: 0 4px 0 rgba(0,0,0,0.3); font-weight: bold;
        }
        .menu-btn:active { transform: translateY(3px); box-shadow: none; }
        .menu-btn:hover { filter: brightness(1.1); transform: scale(1.02); }

        .btn-short { background: #1abc9c; color: white; border: 3px solid #fff; }
        .btn-mid { background: #3498db; color: white; border: 3px solid #fff; }
        .btn-long { background: #9b59b6; color: white; border: 3px solid #fff; }

        .topic-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 95%; max-width: 500px; }
        .topic-btn {
            background: rgba(52, 73, 94, 0.95); color: white; padding: 15px; font-size: 1rem;
            border-radius: 12px; border: 2px solid #7f8c8d; cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,0.4); font-weight: bold;
        }
        .topic-btn:hover { border-color: var(--accent); background: rgba(44, 62, 80, 1); }

        /* --- GAME LAYOUT --- */
        #game-container { display: flex; width: 100%; height: 100%; }
        .player-panel {
            position: relative; display: flex; flex-direction: column;
            border-right: 3px solid #000; overflow: hidden; height: 100%;
        }
        .full-width { width: 100%; border: none; }
        .half-width { width: 50%; }

        .canvas-wrapper {
            position: relative; flex-grow: 1; width: 100%;
            background: url('assets/bg-city.jpeg');
            background-size: cover; background-position: center bottom;
            border-bottom: 4px solid #000; overflow: hidden;
        }
        .canvas-wrapper::before { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0, 0, 0, 0.2); pointer-events: none; }
        canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 1; }

        /* HUD */
        .hud-container {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; pointer-events: none; z-index: 10;
        }
        .hud-box {
            background: rgba(0,0,0,0.7); color: white;
            padding: 6px 12px; border-radius: 8px; font-weight: bold;
            font-size: clamp(0.8rem, 1.2vw, 1.1rem);
            border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px);
        }
        .hearts { color: #e74c3c; letter-spacing: 2px; }

        /* KEYPAD */
        .keypad-area {
            height: 35%; max-height: 300px; min-height: 180px;
            background: #222; padding: 5px; padding-bottom: env(safe-area-inset-bottom, 10px);
            display: flex; justify-content: center; align-items: center;
            border-top: 3px solid #000; box-sizing: border-box; width: 100%;
        }
        .keypad-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr 0.8fr;
            grid-template-rows: repeat(4, 1fr); gap: 5px;
            width: 100%; max-width: 450px; height: 100%;
        }
        .key-btn {
            background: #444; color: white; border: none; border-radius: 8px;
            font-size: clamp(1.2rem, 3vh, 2rem); font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #111; display: flex; justify-content: center; align-items: center;
            position: relative; touch-action: manipulation;
        }
        .key-btn.active { transform: translateY(4px); box-shadow: 0 0 0 #111; background: #666; }
        .p1-keys .key-btn.active { background: var(--p1-color); }
        .p2-keys .key-btn.active { background: var(--p2-color); }
        .btn-fire { grid-column: 4; grid-row: 2 / span 3; background: #e67e22; font-size: 1.8rem; }
        .btn-clr { grid-column: 4; grid-row: 1; background: #c0392b; }
        .btn-neg { grid-column: 1; grid-row: 4; background: #d35400; color: #fff; }
        .btn-0 { grid-column: 2 / span 2; grid-row: 4; }

        .input-display {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: var(--accent);
            padding: 5px 25px; border-radius: 12px;
            font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: bold;
            border: 3px solid var(--accent); min-width: 90px; text-align: center;
            z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* TOMBOL LAYAR PENUH: mengambang di pojok kanan atas, di menu maupun saat main */
        #btn-fullscreen {
            position: fixed; top: 10px; right: 10px; z-index: 100;
            width: 46px; height: 46px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.35);
            background: rgba(0,0,0,0.55); color: #fff; font-size: 1.5rem; line-height: 1;
            cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            touch-action: manipulation; user-select: none;
        }
        #btn-fullscreen:active { transform: translateY(2px); }

        /* MODALS */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none;
            flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 50; text-align: center; backdrop-filter: blur(5px);
        }
        .victory-title {
            font-size: clamp(3rem, 6vw, 5rem); color: var(--win-color);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 4px 4px 0 #000;
            margin: 0; animation: bounce 1s infinite alternate;
        }
        .defeat-title {
            font-size: clamp(3rem, 6vw, 5rem); color: #e74c3c;
            text-shadow: 4px 4px 0 #000; margin: 0;
        }
        .rekor-line {
            font-size: 1.15rem; margin: 6px 0 0; color: #f7dc6f;
            text-shadow: 2px 2px 0 #000; font-weight: bold;
        }
        .rekor-line.new { animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.1); } }

        .restart-btn-in-game {
            background: #27ae60; color: white; border: 4px solid white;
            padding: 15px 40px; font-size: 1.5rem; border-radius: 50px;
            cursor: pointer; margin-top: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            font-weight: bold; pointer-events: auto;
        }
        .restart-btn-in-game:hover { transform: scale(1.05); }
        .restart-btn-in-game.again-btn { background: #e67e22; }

        #confetti-canvas {
            position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 90;
        }

        @media (max-width: 600px) { 
            .topic-grid { grid-template-columns: 1fr; }
            .mode-selection-container { gap: 10px; }
            .mode-btn-img { height: 20vh; }
            .diff-selection-container { gap: 10px; }
            .diff-btn-img { height: 15vh; } 
        }
    </style>
</head>
<body>

    <!-- AUDIO LIBRARY -->
    <audio id="bgm-menu" loop preload="auto">
        <source src="assets/bgm-menu.mp3" type="audio/mpeg">
    </audio>
    <audio id="bgm-game" loop preload="auto">
        <source src="assets/bgm-game.mp3" type="audio/mpeg">
    </audio>

    <canvas id="confetti-canvas"></canvas>

    <!-- MENU UTAMA -->
    <div id="menu-screen">
        <button id="btn-fullscreen" title="Layar Penuh" onclick="toggleFullscreen()">⛶</button>
        <div class="title">Nembak Zombi</div>
        <div class="rekor-menu" id="rekor-menu"></div>
        <div class="speed-group speed-menu">
            <span class="speed-label">Kecepatan Zombie:</span>
            <button class="speed-btn" data-k="0.5">Lambat</button>
            <button class="speed-btn" data-k="0.75">Sedang</button>
            <button class="speed-btn" data-k="1">Cepat</button>
        </div>
        
        <!-- STEP 1: MODE SELECT -->
        <div id="step-player" class="menu-step">
            <img src="assets/header-pilih-mode.png" alt="Pilih Mode" class="mode-header-img">
            <div class="mode-selection-container">
                <img src="assets/btn-1p-id.png" class="mode-btn-img" onclick="initAudio(); goToDifficulty(1)" alt="1 Pemain">
                <img src="assets/btn-2p-id.png" class="mode-btn-img" onclick="initAudio(); goToDifficulty(2)" alt="2 Pemain">
            </div>
        </div>

        <!-- STEP 2: DIFFICULTY SELECT -->
        <div id="step-difficulty" class="menu-step hidden">
            <h2 style="color:#eee; margin-bottom:20px; font-size:1.5rem; text-shadow:2px 2px 2px #000;">Tingkat Kesulitan</h2>
            <div class="diff-selection-container">
                <img src="assets/btn-mudah.png" class="diff-btn-img" onclick="handleDifficultySelect('easy')" alt="Mudah">
                <img src="assets/btn-sedang.png" class="diff-btn-img" onclick="handleDifficultySelect('medium')" alt="Sedang">
                <img src="assets/btn-sulit.png" class="diff-btn-img" onclick="handleDifficultySelect('hard')" alt="Sulit">
            </div>
            <div class="speed-group">
                <span class="speed-label">Kecepatan Zombie:</span>
                <button class="speed-btn" data-k="0.5">Lambat</button>
                <button class="speed-btn" data-k="0.75">Sedang</button>
                <button class="speed-btn" data-k="1">Cepat</button>
            </div>
            <button class="menu-btn" style="width:auto; padding:10px 20px; margin-top:30px;" onclick="backToPlayer()">Kembali</button>
        </div>

        <div id="step-target" class="menu-step hidden">
            <h2 style="color:#eee; margin-bottom:15px; font-size:1.5rem; text-shadow:2px 2px 2px #000;">Sasaran Kemenangan</h2>
            <button class="menu-btn btn-short" onclick="goToTopicFromTarget(100)">CEPAT (100 Poin)</button>
            <button class="menu-btn btn-mid" onclick="goToTopicFromTarget(250)">SEDANG (250 Poin)</button>
            <button class="menu-btn btn-long" onclick="goToTopicFromTarget(500)">LAMA (500 Poin)</button>
            <button class="menu-btn" style="width:auto; padding:10px 20px; margin-top:20px;" onclick="backToDifficulty()">Kembali</button>
        </div>

        <div id="step-topic" class="menu-step hidden">
            <h2 style="color:#eee; margin-bottom:15px; font-size:1.5rem; text-shadow:2px 2px 2px #000;">Pilih Materi</h2>
            <div class="topic-grid">
                <button class="topic-btn" onclick="startGame('add')">Penjumlahan (+)</button>
                <button class="topic-btn" onclick="startGame('sub')">Pengurangan (-)</button>
                <button class="topic-btn" onclick="startGame('mul')">Perkalian (×)</button>
                <button class="topic-btn" onclick="startGame('div')">Pembagian (÷)</button>
                <button class="topic-btn" onclick="startGame('mix')">Campuran (+ - × ÷)</button>
                <button class="topic-btn" onclick="startGame('int')">Bilangan Bulat (+/-)</button>
            </div>
            <button class="menu-btn" style="width:auto; padding:10px 20px; margin-top:20px;" onclick="backToTargetOrDiff()">Kembali</button>
        </div>
    </div>

    <!-- GAME CONTAINER -->
    <div id="game-container" style="display:none;">
        <div id="p1-panel" class="player-panel full-width">
            <div class="canvas-wrapper">
                <div class="hud-container">
                    <div class="hud-box">Sasaran: <span id="p1-target">100</span></div>
                    <div class="hud-box">Nilai: <span id="p1-score">0</span></div>
                    <div class="hud-box hearts" id="p1-hearts">❤️❤️❤️</div>
                </div>
                <canvas id="canvas1"></canvas>
                <div class="input-display" id="p1-display">?</div>
                <div class="modal-overlay" id="p1-modal">
                    <h2 id="p1-modal-title" class="victory-title">Menang</h2>
                    <p style="font-size: 1.2rem;">Nilai Akhir: <span id="p1-final">0</span></p>
                    <p class="rekor-line" id="p1-rekor"></p>
                    <button class="restart-btn-in-game again-btn" onpointerdown="restartGame()">Main Lagi 🔁</button>
                    <button class="restart-btn-in-game" onpointerdown="toggleFullscreen()">Main Layar Penuh ⛶</button>
                    <button class="restart-btn-in-game" onpointerdown="backToMenu()">Menu Utama</button>
                </div>
            </div>
            <div class="keypad-area p1-keys">
                <div class="keypad-grid">
                    <button class="key-btn" data-val="7">7</button> <button class="key-btn" data-val="8">8</button> <button class="key-btn" data-val="9">9</button> <button class="key-btn btn-clr" data-action="clear">⌫</button>
                    <button class="key-btn" data-val="4">4</button> <button class="key-btn" data-val="5">5</button> <button class="key-btn" data-val="6">6</button> <button class="key-btn btn-fire" data-action="fire">🔥</button>
                    <button class="key-btn" data-val="1">1</button> <button class="key-btn" data-val="2">2</button> <button class="key-btn" data-val="3">3</button>
                    <button class="key-btn btn-neg" data-val="-">(-)</button> <button class="key-btn btn-0" data-val="0">0</button>
                </div>
            </div>
        </div>

        <div id="p2-panel" class="player-panel half-width" style="display: none;">
            <div class="canvas-wrapper">
                <div class="hud-container">
                    <div class="hud-box">Nilai: <span id="p2-score">0</span></div>
                    <div class="hud-box hearts" id="p2-hearts">❤️❤️❤️</div>
                </div>
                <canvas id="canvas2"></canvas>
                <div class="input-display" id="p2-display">?</div>
                <div class="modal-overlay" id="p2-modal">
                    <h2 id="p2-modal-title" class="victory-title">Menang</h2>
                    <p style="font-size: 1.2rem;">Nilai Akhir: <span id="p2-final">0</span></p>
                    <p class="rekor-line" id="p2-rekor"></p>
                    <button class="restart-btn-in-game again-btn" onpointerdown="restartGame()">Main Lagi 🔁</button>
                    <button class="restart-btn-in-game" onpointerdown="toggleFullscreen()">Main Layar Penuh ⛶</button>
                    <button class="restart-btn-in-game" onpointerdown="backToMenu()">Menu Utama</button>
                </div>
            </div>
            <div class="keypad-area p2-keys">
                <div class="keypad-grid">
                    <button class="key-btn" data-val="7">7</button> <button class="key-btn" data-val="8">8</button> <button class="key-btn" data-val="9">9</button> <button class="key-btn btn-clr" data-action="clear">⌫</button>
                    <button class="key-btn" data-val="4">4</button> <button class="key-btn" data-val="5">5</button> <button class="key-btn" data-val="6">6</button> <button class="key-btn btn-fire" data-action="fire">🔥</button>
                    <button class="key-btn" data-val="1">1</button> <button class="key-btn" data-val="2">2</button> <button class="key-btn" data-val="3">3</button>
                    <button class="key-btn btn-neg" data-val="-">(-)</button> <button class="key-btn btn-0" data-val="0">0</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- AUDIO SYSTEM ---
        const bgmMenu = document.getElementById('bgm-menu');
        const bgmGame = document.getElementById('bgm-game');
        
        const SHOOT_URL = "assets/sfx-shoot.mp3";
        const WIN_URL = "assets/sfx-win.mp3";
        const WRONG_URL = "assets/sfx-wrong.mp3";
        const sfxPool = []; const SFX_POOL_SIZE = 5; let sfxPoolIdx = 0;
        for (let i = 0; i < SFX_POOL_SIZE; i++) { const a = new Audio(SHOOT_URL); a.volume = 0.6; a.preload = 'auto'; sfxPool.push(a); }

        let audioStarted = false;

        function initAudio() {
            if (!audioStarted) {
                bgmMenu.volume = 0.5; bgmGame.volume = 0.3;
                audioStarted = true;
            }
            bgmMenu.play().catch(() => {}); // dipanggil dari klik user (kebijakan autoplay)
        }

        function switchMusic(toGame) {
            if (toGame) { bgmMenu.pause(); bgmMenu.currentTime = 0; bgmGame.play().catch(()=>{}); } 
            else { bgmGame.pause(); bgmGame.currentTime = 0; bgmMenu.play().catch(()=>{}); }
        }
        function playShootSfx() { const sfx = sfxPool[sfxPoolIdx]; sfxPoolIdx = (sfxPoolIdx + 1) % SFX_POOL_SIZE; sfx.currentTime = 0; sfx.play().catch(e => {}); }
        const wrongSfx = new Audio(WRONG_URL); wrongSfx.volume = 0.7; wrongSfx.preload = 'auto';
        function playWrongSfx() { wrongSfx.currentTime = 0; wrongSfx.play().catch(e => {}); }
        function playWinSfx() { const sfx = new Audio(WIN_URL); sfx.volume = 1.0; sfx.play().catch(e => {}); }
        function speakVictory() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("Hore! Kamu berhasil nembak semua zombie!");
                utterance.lang = 'id-ID'; utterance.rate = 1.05; utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- CONFETTI ---
        const confCanvas = document.getElementById('confetti-canvas');
        const confCtx = confCanvas.getContext('2d');
        let confettis = [];
        function resizeConfetti() { confCanvas.width = window.innerWidth; confCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeConfetti); resizeConfetti();
        function fireConfetti() {
            for(let i=0; i<100; i++) {
                confettis.push({ x: Math.random()*confCanvas.width, y: Math.random()*confCanvas.height-confCanvas.height, vx: (Math.random()-0.5)*5, vy: Math.random()*5+2, c: `hsl(${Math.random()*360}, 100%, 50%)`, size: Math.random()*10+5, rot: Math.random()*360, vRot: (Math.random()-0.5)*10 });
            }
        }
        function updateConfetti() {
            confCtx.clearRect(0,0,confCanvas.width, confCanvas.height);
            for(let i=0; i<confettis.length; i++) {
                let p = confettis[i]; p.y += p.vy; p.x += p.vx; p.rot += p.vRot; if(p.y > confCanvas.height) p.y = -10;
                confCtx.save(); confCtx.translate(p.x, p.y); confCtx.rotate(p.rot * Math.PI/180); confCtx.fillStyle = p.c; confCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size); confCtx.restore();
            }
            if(confettis.length > 0) requestAnimationFrame(updateConfetti);
        }

        // --- ASSETS ---
        const ZOMBIE_URLS = ["assets/zombie1.png", "assets/zombie2.png", "assets/zombie3.png", "assets/zombie4.png", "assets/zombie5.png", "assets/zombie6.png", "assets/zombie7.png"];
        const zombieImages = []; ZOMBIE_URLS.forEach(url => { const img = new Image(); img.src = url; zombieImages.push(img); });

        // --- GLOBALS ---
        let gameMode = 1; let difficulty = 'medium'; let topic = 'add'; let isRunning = false;
        let p1Game, p2Game; let animId; let targetScore = 250; let pendingStart = null;
        let kecepatanZombie = 0.75;   // pengali: 0.5 Lambat, 0.75 Sedang, 1 Cepat
        try { const k = parseFloat(localStorage.getItem('nembak-zombi-kecepatan')); if (k >= 0.25 && k <= 2) kecepatanZombie = k; } catch (e) {}

        function setKecepatanZombie(k) {
            kecepatanZombie = k;
            try { localStorage.setItem('nembak-zombi-kecepatan', String(k)); } catch (e) {}
            document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('aktif', parseFloat(b.dataset.k) === k));
        }
        setKecepatanZombie(kecepatanZombie);   // tandai tombol aktif sesuai pilihan tersimpan
        // hubungkan tombol Lambat/Sedang/Cepat ke pengaturan (dulu kliknya mati: tak ada handler)
        document.querySelectorAll('.speed-btn').forEach(b => b.addEventListener('click', () => setKecepatanZombie(parseFloat(b.dataset.k))));

        // --- TRANSISI ANTAR LANGKAH MENU ---
        function gantiLangkah(dariId, keId) {
            const dari = document.getElementById(dariId);
            const ke = document.getElementById(keId);
            if (!dari || !ke || dari === ke) return;
            dari.classList.add('keluar');
            setTimeout(() => {
                dari.classList.add('hidden'); dari.classList.remove('keluar');
                ke.classList.remove('hidden');   // animasi masuk berurutan diputar otomatis
            }, 200);
        }

        // --- NAVIGATION ---
        function goToDifficulty(mode) { gameMode = mode; gantiLangkah('step-player', 'step-difficulty'); }
        function backToPlayer() { gantiLangkah('step-difficulty', 'step-player'); }
        function handleDifficultySelect(diff) { difficulty = diff; if(gameMode===1) gantiLangkah('step-difficulty', 'step-target'); else gantiLangkah('step-difficulty', 'step-topic'); }
        function backToDifficulty() { gantiLangkah('step-target', 'step-difficulty'); }
        function goToTopicFromTarget(score) { targetScore = score; gantiLangkah('step-target', 'step-topic'); }
        function backToTargetOrDiff() { if(gameMode===1) gantiLangkah('step-topic', 'step-target'); else gantiLangkah('step-topic', 'step-difficulty'); }

        function startGame(selectedTopic) {
            topic = selectedTopic;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            switchMusic(true);

            const p1 = document.getElementById('p1-panel'); const p2 = document.getElementById('p2-panel');
            const targetEl = document.getElementById('p1-target');
            if(gameMode === 1) { targetEl.parentElement.style.display = 'block'; targetEl.innerText = targetScore; } 
            else { targetEl.parentElement.style.display = 'none'; }

            if (gameMode === 2) { p1.className = 'player-panel half-width'; p2.style.display = 'flex'; } 
            else { p1.className = 'player-panel full-width'; p2.style.display = 'none'; }

            confettis = []; 
            isRunning = false; cancelAnimationFrame(animId);   // hentikan loop lama bila masih berjalan
            if (pendingStart) { clearTimeout(pendingStart); }
            pendingStart = setTimeout(() => {
                p1Game = new GameInstance('canvas1', 1); p1Game.resize();
                if (gameMode === 2) { p2Game = new GameInstance('canvas2', 2); p2Game.resize(); }
                setupMultiTouch();
                isRunning = true; gameLoop();
            }, 100);
        }

        function backToMenu() {
            isRunning = false; cancelAnimationFrame(animId);
            document.getElementById('p1-modal').style.display = 'none'; document.getElementById('p2-modal').style.display = 'none';
            document.getElementById('game-container').style.display = 'none'; document.getElementById('menu-screen').style.display = 'flex';
            document.getElementById('step-topic').classList.add('hidden'); document.getElementById('step-topic').classList.remove('keluar');
            document.getElementById('step-target').classList.add('hidden'); document.getElementById('step-target').classList.remove('keluar');
            document.getElementById('step-difficulty').classList.add('hidden'); document.getElementById('step-difficulty').classList.remove('keluar');
            document.getElementById('step-player').classList.remove('hidden'); document.getElementById('step-player').classList.remove('keluar');
            switchMusic(false); confettis = []; confCtx.clearRect(0,0,confCanvas.width, confCanvas.height);
            tampilRekorMenu();
        }

        // Perangkat mobile: kunci orientasi landscape selagi layar penuh (layout 2 pemain dirancang menyamping).
        // Gagal senyap di desktop/iOS — di sana orientasi memang tidak bisa dikunci dan game tetap jalan normal.
        function kunciOrientasiLandscape() {
            try {
                if (screen.orientation && screen.orientation.lock) {
                    const p = screen.orientation.lock('landscape');
                    if (p && p.catch) p.catch(() => {});
                }
            } catch (e) { /* diabaikan: tidak semua perangkat mendukung */ }
        }
        function lepasKunciOrientasi() {
            try {
                if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
            } catch (e) { /* diabaikan */ }
        }
        function toggleFullscreen() {
            const doc = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const minta = doc.requestFullscreen ? doc.requestFullscreen() : (doc.webkitRequestFullscreen ? doc.webkitRequestFullscreen() : Promise.reject());
                Promise.resolve(minta).then(kunciOrientasiLandscape).catch(() => {});   // ditolak browser: biarkan saja, game tetap jalan
            }
            else {
                lepasKunciOrientasi();
                const keluar = document.exitFullscreen ? document.exitFullscreen() : (document.webkitExitFullscreen ? document.webkitExitFullscreen() : Promise.reject());
                Promise.resolve(keluar).catch(() => {});
            }
        }
        // sesuaikan tampilan ikon setelah masuk/keluar layar penuh (termasuk tombol Esc)
        function perbaruiIkonFullscreen() {
            const b = document.getElementById('btn-fullscreen');
            if (b) b.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? '⤡' : '⛶';
        }
        document.addEventListener('fullscreenchange', perbaruiIkonFullscreen);
        document.addEventListener('webkitfullscreenchange', perbaruiIkonFullscreen);
        // keluar fullscreen lewat Esc/tombol sistem: ikon kembali + kunci orientasi dilepas
        document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) lepasKunciOrientasi(); });

        function tampilRekorMenu() {
            const el = document.getElementById('rekor-menu');
            if (!el) return;
            let rekor = 0;
            try { rekor = parseInt(localStorage.getItem('nembak-zombi-rekor')) || 0; } catch (e) {}
            if (rekor > 0) {
                el.innerText = `🏆 Rekor Tertinggi: ${rekor} poin`;
                el.classList.add('tampil');
            } else {
                el.classList.remove('tampil');
            }
        }
        tampilRekorMenu();

        function restartGame() {
            isRunning = false; cancelAnimationFrame(animId);
            if (pendingStart) { clearTimeout(pendingStart); pendingStart = null; }
            document.getElementById('p1-modal').style.display = 'none'; document.getElementById('p2-modal').style.display = 'none';
            confettis = []; confCtx.clearRect(0,0,confCanvas.width, confCanvas.height);
            startGame(topic);   // langsung main lagi dengan materi & mode yang sama
        }

        function setupMultiTouch() {
            const attachListeners = (selector, gameInstance) => {
                const buttons = document.querySelectorAll(selector);
                buttons.forEach(btn => {
                    btn.onpointerdown = (e) => {
                        e.preventDefault(); 
                        btn.classList.add('active'); setTimeout(() => btn.classList.remove('active'), 100);
                        const val = btn.getAttribute('data-val'); const action = btn.getAttribute('data-action');
                        if (action === 'clear') gameInstance.clearInput();
                        else if (action === 'fire') gameInstance.fire();
                        else if (val !== null) gameInstance.inputNum(val);
                    };
                });
            };
            if (p1Game) attachListeners('.p1-keys .key-btn', p1Game);
            if (p2Game) attachListeners('.p2-keys .key-btn', p2Game);
        }

        // --- GAME ENGINE ---
        class GameInstance {
            constructor(canvasId, pid) {
                this.canvas = document.getElementById(canvasId); this.ctx = this.canvas.getContext('2d'); this.pid = pid;
                this.elScore = document.getElementById(`p${pid}-score`); this.elHearts = document.getElementById(`p${pid}-hearts`);
                this.elDisplay = document.getElementById(`p${pid}-display`); this.elModal = document.getElementById(`p${pid}-modal`);
                this.elModalTitle = document.getElementById(`p${pid}-modal-title`); this.elFinal = document.getElementById(`p${pid}-final`); this.elRekor = document.getElementById(`p${pid}-rekor`);
                
                // RESET STATE
                this.score = 0; 
                this.level = 1; 
                this.lives = 3; 
                this.input = "";
                
                // RESET UI
                this.elScore.innerText = "0";
                this.elHearts.innerText = "❤️❤️❤️";
                this.elDisplay.innerText = "?";
                this.elDisplay.style.borderColor = "#f1c40f"; 
                this.elDisplay.style.color = "#f1c40f";
                this.elRekor.innerText = ""; this.elRekor.classList.remove('new');
                this.elModal.style.display = 'none';

                this.zombies = []; this.bullets = []; this.particles = []; this.shockwaves = []; this.melayang = []; this.guncang = 0; this.combo = 0; this.comboTerbaik = 0; this.lastSpawn = 0; this.isOver = false;
                this.spawnRate = difficulty === 'easy' ? 4000 : (difficulty === 'medium' ? 3000 : 2000);
                this.playerPos = { x: 0, y: 0 };
            }
            resize() {
                const w = this.canvas.parentElement.clientWidth; const h = this.canvas.parentElement.clientHeight;
                this.canvas.width = w; this.canvas.height = h; this.playerPos = { x: w/2, y: h - 50 }; 
            }
            update(dt) {
                if (this.isOver) return;
                this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
                // getaran layar: aktif sesaat setelah ledakan dramatis, melemah cepat lalu berhenti
                this.guncang = Math.max(0, this.guncang - 32 * (dt || 16.7) / 1000);
                const guncangX = (Math.random()-0.5) * 2 * this.guncang, guncangY = (Math.random()-0.5) * 2 * this.guncang;
                this.ctx.save();
                this.ctx.translate(guncangX, guncangY);
                this.drawPlayer();
                const now = Date.now();
                if (now - this.lastSpawn > this.spawnRate) { this.zombies.push(new Zombie(this.canvas.width, this.level, this.zombies)); this.lastSpawn = now; }
                for (let i = this.zombies.length - 1; i >= 0; i--) {
                    let z = this.zombies[i]; z.update(dt); z.draw(this.ctx);
                    if (z.y > this.canvas.height - 40) {
                        if (this.lives <= 0 || this.isOver) return;   // sudah kalah: hentikan update agar nyawa tidak minus
                        this.combo = 0;   // zombie lolos: combo putus
                        this.lives--; this.updateHearts(); this.createExplosion(z.x, z.y, 'red');
                        z.dead = true;
                        this.zombies.splice(i, 1); if (this.lives <= 0) this.gameOver(false);
                    }
                }
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    let b = this.bullets[i]; b.update(dt);
                    let kena = b.target && !b.target.dead && b.kenaTarget();
                    if (kena) {
                        // PELURU MENGHENAI ZOMBIE: zombie mati di titik ini
                        this.combo++;   // tembakan benar beruntun
                        if (this.combo > this.comboTerbaik) this.comboTerbaik = this.combo;   // catat beruntun terbaik sesi ini
                        const bonus = Math.min(this.combo - 1, 5) * 5;   // bonus naik sampai +25
                        const poin = 10 + bonus;
                        if (b.target.doomed) this.createDramaticExplosion(b.target.x, b.target.y, this.combo);
                        else this.createExplosion(b.target.x, b.target.y, '#2ecc71');
                        this.melayang.push(this.combo >= 2
                            ? new TeksMelayang(b.target.x, b.target.y - 10, `COMBO x${this.combo} +${poin}`, '#e67e22')
                            : new TeksMelayang(b.target.x, b.target.y - 10, `+${poin}`, '#ffffff'));
                        const idx = this.zombies.indexOf(b.target);
                        if (idx !== -1) this.zombies.splice(idx, 1);
                        b.target.dead = true;
                        const skorSebelum = this.score;
                        this.score += poin;
                        // naik level tiap melewati kelipatan 50 poin (aman walau skor melompat karena bonus combo)
                        if (Math.floor(this.score / 50) > Math.floor(skorSebelum / 50)) {
                            this.level++;
                            let minRate = difficulty === 'hard' ? 800 : (difficulty === 'medium' ? 1200 : 2000);
                            this.spawnRate = Math.max(minRate, this.spawnRate - 200);
                        }
                        this.elScore.innerText = this.score;
                        if (gameMode === 1 && this.score >= targetScore) this.gameOver(true);
                    }
                    if (kena || (b.target && b.target.dead) || b.outOfBounds(this.canvas.width, this.canvas.height)) this.bullets.splice(i, 1);
                    else b.draw(this.ctx);
                }
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i]; p.update(dt); p.draw(this.ctx);
                    if(p.life <= 0) this.particles.splice(i,1);
                }
                for (let i = this.shockwaves.length - 1; i >= 0; i--) {
                    let sw = this.shockwaves[i]; sw.update(dt); sw.draw(this.ctx);
                    if(sw.life <= 0) this.shockwaves.splice(i,1);
                }
                for (let i = this.melayang.length - 1; i >= 0; i--) {
                    let t = this.melayang[i]; t.update(dt); t.draw(this.ctx);
                    if(t.life <= 0) this.melayang.splice(i,1);
                }
                this.ctx.restore();
            }
            drawPlayer() {
                const {x, y} = this.playerPos; this.ctx.fillStyle = this.pid === 1 ? '#3498db' : '#e74c3c';
                this.ctx.beginPath(); this.ctx.arc(x, y + 20, 25, 0, Math.PI, true); this.ctx.fill();
                this.ctx.fillStyle = "#ecf0f1"; this.ctx.fillRect(x-6, y-35, 12, 40);
                this.ctx.fillStyle = "#2c3e50"; this.ctx.fillRect(x-8, y-35, 16, 8);
            }
            inputNum(val) {
                if(this.isOver) return;
                if(val === '-') { if(this.input === "") this.input = "-"; else if(this.input === "-") this.input = ""; } 
                else { if(this.input.length < 5) this.input += val; }
                this.updateDisplay();
            }
            clearInput() { this.input = ""; this.updateDisplay(); }
            updateDisplay() {
                this.elDisplay.innerText = this.input === "" ? "?" : this.input;
                this.elDisplay.style.borderColor = "#f1c40f"; this.elDisplay.style.color = "#f1c40f";
            }
            fire() {
                if(this.isOver || this.input === "" || this.input === "-") return;
                const ans = parseInt(this.input); let hit = false;
                this.zombies.sort((a,b) => b.y - a.y);
                for(let i=0; i<this.zombies.length; i++) {
                    if(this.zombies[i].answer === ans && !this.zombies[i].doomed) {
                        playShootSfx();
                        this.zombies[i].doomed = true;   // ditandai: peluru sedang menuju ke dia
                        this.bullets.push(new Bullet(this.playerPos.x, this.playerPos.y - 30, this.zombies[i]));
                        hit = true;
                        this.elDisplay.style.borderColor = "#2ecc71"; this.elDisplay.style.color = "#2ecc71";
                        setTimeout(() => this.updateDisplay(), 200); break;
                    }
                }
                if(!hit) {
                    playWrongSfx();
                    this.combo = 0;   // jawaban salah: combo putus
                    this.elDisplay.style.borderColor = "#e74c3c"; this.elDisplay.style.color = "#e74c3c";
                    setTimeout(() => this.updateDisplay(), 200);
                }
                this.input = "";
            }
            createExplosion(x,y,c) { for(let i=0; i<12; i++) this.particles.push(new Particle(x,y,c)); }
            createDramaticExplosion(x,y,kombo) {
                // Ledakan dramatis untuk zombie yang ditandai doomed: gelombang kejut + semburan besar + percikan kilat + getaran layar
                this.shockwaves.push(new Shockwave(x,y));
                this.guncang = 9 + Math.min(kombo || 0, 10) * 0.7;   // combo makin panjang, getaran makin kuat (maks ~16px)
                for(let i=0; i<26; i++) this.particles.push(new Particle(x,y, i%4===0 ? '#f1c40f' : '#2ecc71', true));
                for(let i=0; i<10; i++) this.particles.push(new Particle(x,y,'#ffffff', true));
            }
            updateHearts() { this.elHearts.innerText = "❤️".repeat(Math.max(0, this.lives)); }
            updateRekorLine() {
                if (gameMode !== 1 || !this.elRekor) return;
                const kunci = 'nembak-zombi-rekor', kunciCombo = 'nembak-zombi-rekor-combo';
                let rekor = 0, rekorCombo = 0;
                try { rekor = parseInt(localStorage.getItem(kunci)) || 0; rekorCombo = parseInt(localStorage.getItem(kunciCombo)) || 0; } catch (e) {}
                let rekorBaru = false, comboBaru = false;
                if (this.score > rekor) { rekor = this.score; rekorBaru = true; try { localStorage.setItem(kunci, String(rekor)); } catch (e) {} }
                if (this.comboTerbaik > rekorCombo) { rekorCombo = this.comboTerbaik; comboBaru = true; try { localStorage.setItem(kunciCombo, String(rekorCombo)); } catch (e) {} }
                let teks = rekorBaru ? `🏆 Rekor Baru: ${rekor} poin!` : `Rekor Tertinggi: ${rekor} poin`;
                if (rekorCombo >= 2) teks += comboBaru ? `  |  🔥 Combo Terpanjang Baru: x${rekorCombo}!` : `  |  🔥 Combo Terpanjang: x${rekorCombo}`;
                this.elRekor.innerText = teks;
                this.elRekor.classList.toggle('new', rekorBaru || comboBaru);
            }
            gameOver(isVictory) {
                this.isOver = true; this.elFinal.innerText = this.score; this.elModal.style.display = 'flex'; this.updateRekorLine();
                if (isVictory) {
                    this.elModalTitle.innerText = "Menang"; this.elModalTitle.className = "victory-title";
                    if (!confettis.length) { fireConfetti(); updateConfetti(); }
                } else {
                    this.elModalTitle.innerText = "Kalah"; this.elModalTitle.className = "defeat-title";
                }
                handleGlobalEnd(this.pid, isVictory);
            }
        }

        // --- ENTITIES ---
        class Zombie {
            constructor(canvasW, level, zombiesAda) {
                this.r = 30; this.y = -60;
                // pilih posisi X agar papan soal tidak menutupi papan zombie lain yang masih tampil sebaris
                const jarakPapan = 120;   // papan soal ~110px + sedikit jarak aman
                let xTerbaik = null, jarakTerbaik = -1;
                for (let coba = 0; coba < 25; coba++) {
                    const cx = Math.random() * (canvasW - 2*this.r) + this.r;
                    let jarakMin = Infinity;
                    if (zombiesAda) for (const z of zombiesAda) {
                        if (z.dead || Math.abs(z.y - this.y) > 100) continue;   // hanya tetangga yang sebaris vertikal
                        jarakMin = Math.min(jarakMin, Math.abs(z.x - cx));
                    }
                    if (jarakMin === Infinity || jarakMin >= jarakPapan) { xTerbaik = cx; break; }   // lega: langsung pakai
                    if (jarakMin > jarakTerbaik) { jarakTerbaik = jarakMin; xTerbaik = cx; }   // sempit: catat yang paling jauh
                }
                this.x = Math.max(this.r, Math.min(canvasW - this.r, xTerbaik));
                this.image = zombieImages[Math.floor(Math.random() * zombieImages.length)];
                // kecepatan dasar dalam px per detik — dikalibrasi lebih pelan dari versi lama
                let baseSpeed = difficulty === 'easy' ? 14 : (difficulty === 'hard' ? 45 : 26);
                this.speed = (baseSpeed + (level * 3)) * kecepatanZombie;   // px/detik × pilihan pemain
                this.wiggle = Math.random() * 100;
                this.generateProblem(level, zombiesAda);
            }
            generateProblem(level, zombiesAda) {
                let diffMult = difficulty === 'easy' ? 0.5 : (difficulty === 'hard' ? 2.0 : 1);
                let a, b, op = topic === 'mix' ? ['add','sub','mul','div'][Math.floor(Math.random()*4)] : topic;
                let range = Math.floor((5 * level * diffMult) + (difficulty === 'hard' ? 20 : 5));
                // Pola bilangan menantang muncul mulai level 3-4: suku yang hilang (mis. 7+?=15),
                // tabel perkalian/pembagi yang melebar, dan rentang bilangan bulat yang tumbuh — bukan sekadar angka besar
                const tantang = level >= 3 ? Math.min(0.6, (level - 2) * 0.15) : 0;
                const buatSoal = () => {
                    if (op === 'add') {
                        if (Math.random() < tantang) { const jumlah = r(range*2)+6; a = r(jumlah-2)+1; this.text=`${a}+?=${jumlah}`; this.answer=jumlah-a; }
                        else { a=r(range)+2; b=r(range)+2; this.text=`${a}+${b}`; this.answer=a+b; }
                    }
                    else if (op === 'sub') {
                        if (Math.random() < tantang) { a=r(range*1.5)+5; const c=r(a-2)+1; this.text=`${a}-?=${c}`; this.answer=a-c; }
                        else { a=r(range*1.5)+5; b=r(a); this.text=`${a}-${b}`; this.answer=a-b; }
                    }
                    else if (op === 'mul') {
                        let m=Math.min(12,(difficulty==='easy'?5:9)+Math.floor(level/2));   // tabel perkalian melebar tiap 2 level
                        if (level >= 4 && Math.random() < tantang) { a=r(m-2)+2; b=r(m-2)+2; this.text=`${a}×?=${a*b}`; this.answer=b; }
                        else { a=r(m)+2; b=r(m)+2; this.text=`${a}×${b}`; this.answer=a*b; }
                    }
                    else if (op === 'div') {
                        let bmax=Math.min(12,9+Math.floor(level/3)), resmax=Math.min(12,10+Math.floor(level/3));   // pembagi & hasil melebar tiap 3 level
                        if (level >= 4 && Math.random() < tantang) { b=r(bmax-2)+2; let res=r(resmax)+1; a=b*res; this.text=`${a}÷?=${res}`; this.answer=b; }
                        else { b=r(bmax)+2; let res=r(resmax)+1; a=b*res; this.text=`${a}÷${b}`; this.answer=res; }
                    }
                    else if (op === 'int') {
                        let l=Math.min(30,12+level*3);   // rentang bilangan bulat tumbuh tiap level
                        if (level >= 4 && Math.random() < tantang) { a=r(l*2)-l; b=r(l*2)-l; const c=a+b; this.text=`${a}+?=${c<0?`(${c})`:c}`; this.answer=b; }
                        else { a=r(l*2)-l; b=r(l*2)-l; if (Math.random() > 0.5) { this.text=`${a}+${b<0?`(${b})`:b}`; this.answer=a+b; } else { this.text=`${a}-${b<0?`(${b})`:b}`; this.answer=a-b; } }
                    }
                };
                buatSoal();
                // jawaban harus unik: tidak boleh sama dengan zombie lain yang masih tampil, agar murid tidak bingung
                let coba = 0;
                while (zombiesAda && zombiesAda.some(z => !z.dead && z.answer === this.answer) && coba < 20) { buatSoal(); coba++; }
            }
            update(dt) { const s = (dt || 16.7) / 1000; this.y += this.speed * s; this.x += Math.sin((this.y + this.wiggle) / 40) * 0.5; if(this.x<30)this.x=30; }
            draw(ctx) {
                if(this.image && this.image.complete && this.image.naturalWidth > 0) ctx.drawImage(this.image, this.x-this.r, this.y-this.r, this.r*2, this.r*2);
                else { ctx.fillStyle='#27ae60'; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); }
                if (this.doomed && !this.dead) {
                    // KILAT PUTIH: tanda peluru sedang menuju zombie ini
                    const denyut = 0.25 + 0.25 * Math.sin(performance.now() / 70);
                    ctx.save();
                    ctx.globalAlpha = denyut;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.r + 3, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = Math.min(1, denyut + 0.35);
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.r + 6, 0, Math.PI*2); ctx.stroke();
                    ctx.restore();
                }
                ctx.fillStyle="rgba(255,255,255,0.95)"; ctx.shadowColor="rgba(0,0,0,0.5)"; ctx.shadowBlur=4;
                ctx.beginPath(); ctx.roundRect(this.x-55,this.y-(this.r*2.2),110,32,8); ctx.fill();
                ctx.shadowBlur=0; ctx.strokeStyle="#2c3e50"; ctx.lineWidth=2; ctx.stroke();
                ctx.fillStyle="#2c3e50"; ctx.font="bold 20px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
                const papanY = this.y-(this.r*2.2)+16;
                if (this.text.includes('?')) {
                    // soal suku yang hilang: tanda ? diberi warna aksen oranye + halo agar terlihat spesial
                    ctx.textAlign = "left";
                    const bagian = this.text.split('?');
                    const lebarTanya = ctx.measureText('?').width;
                    let totalLebar = lebarTanya * (bagian.length - 1);
                    for (const bg of bagian) totalLebar += ctx.measureText(bg).width;
                    let px = this.x - totalLebar / 2;
                    for (let i = 0; i < bagian.length; i++) {
                        ctx.fillStyle = "#2c3e50";
                        ctx.fillText(bagian[i], px, papanY);
                        px += ctx.measureText(bagian[i]).width;
                        if (i < bagian.length - 1) {
                            ctx.fillStyle = "#e67e22";
                            ctx.shadowColor = "rgba(230,126,34,0.9)"; ctx.shadowBlur = 6;
                            ctx.fillText('?', px, papanY);
                            ctx.shadowBlur = 0;
                            px += lebarTanya;
                        }
                    }
                    ctx.textAlign = "center";
                }
                else ctx.fillText(this.text, this.x, papanY);
            }
        }
        function r(n) { return Math.floor(Math.random()*n); }
        class Bullet {
            constructor(x, y, target) {
                this.x = x; this.y = y; this.target = target; this.speed = 1500;   // px per detik
                this.ekor = [];   // jejak ekor peluru agar lintasan terbang terlihat
                this.arah();
            }
            arah() {
                const dx = this.target.x - this.x, dy = this.target.y - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy) || 1;
                this.vx = (dx / dist) * this.speed; this.vy = (dy / dist) * this.speed;
            }
            update(dt) { if (this.target && !this.target.dead) this.arah();   // mengejar zombie yang tetap berjalan
                const s = (dt || 16.7) / 1000; this.x += this.vx * s; this.y += this.vy * s;
                this.ekor.push({x: this.x, y: this.y});   // catat posisi untuk ekor
                if (this.ekor.length > 8) this.ekor.shift();
            }
            kenaTarget() {
                const dx = this.x - this.target.x, dy = this.y - this.target.y;
                return Math.sqrt(dx*dx + dy*dy) < this.target.r + 6;   // peluru menyentuh badan zombie
            }
            draw(ctx) {
                // jejak ekor: titik-titik posisi lama, makin jauh dari peluru makin tipis dan kecil
                for (let i = 0; i < this.ekor.length; i++) {
                    const t = (i + 1) / this.ekor.length;   // 0..1, makin dekat peluru makin pekat
                    ctx.globalAlpha = t * 0.4;
                    ctx.fillStyle = '#f5d76e';
                    ctx.beginPath(); ctx.arc(this.ekor[i].x, this.ekor[i].y, 1.5 + 3.5 * t, 0, Math.PI*2); ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.fillStyle='#f1c40f'; ctx.beginPath(); ctx.arc(this.x,this.y,6,0,Math.PI*2); ctx.fill();
            }
            outOfBounds(w,h) { return this.y<-50||this.x<-50||this.x>w+50; }
        }
        class Particle {
            constructor(x, y, c, besar) {
                this.x=x; this.y=y; this.c=c; this.life=1;
                const tenaga = besar ? 1.6 : 1;   // partikel besar: semburan lebih kencang
                this.vx=(Math.random()-0.5)*720*tenaga; this.vy=(Math.random()-0.5)*720*tenaga;
                this.r = besar ? 4 + Math.random()*4 : 5;
            }
            update(dt) { const s = (dt || 16.7) / 1000; this.x+=this.vx*s; this.y+=this.vy*s; this.life-=3*s; }
            draw(ctx) { ctx.globalAlpha=Math.max(0,this.life); ctx.fillStyle=this.c; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
        }
        class TeksMelayang {
            // Teks poin/combo yang melayang naik lalu memudar di titik ledakan
            constructor(x,y,teks,warna) { this.x=x; this.y=y; this.teks=teks; this.c=warna; this.life=1; }
            update(dt) { const s=(dt||16.7)/1000; this.y -= 45*s; this.life -= 1.6*s; }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.c; ctx.font = "bold 18px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 4;
                ctx.fillText(this.teks, this.x, this.y);
                ctx.restore();
            }
        }
        class Shockwave {
            // Gelombang kejut: lingkaran mengembang memudar dari titik ledakan
            constructor(x,y) { this.x=x; this.y=y; this.r=8; this.life=1; }
            update(dt) { const s=(dt||16.7)/1000; this.r += 420*s; this.life -= 2.8*s; }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life) * 0.8;
                ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.stroke();
                ctx.globalAlpha = Math.max(0, this.life) * 0.4;
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(this.x,this.y,this.r*0.75,0,Math.PI*2); ctx.stroke();
                ctx.restore();
            }
        }

        // --- GLOBAL LOGIC ---
        function handleGlobalEnd(pidWhoEnded, isVictory) {
            if (gameMode === 1) {
                if (isVictory) { isRunning = false; cancelAnimationFrame(animId); bgmGame.pause(); playWinSfx(); speakVictory(); } 
                else { isRunning = false; cancelAnimationFrame(animId); }
            }
            else if (gameMode === 2) {
                if (!isVictory) {
                    const winnerId = pidWhoEnded === 1 ? 2 : 1;
                    isRunning = false; cancelAnimationFrame(animId);
                    if (winnerId === 1) { p1Game.gameOver(true); p2Game.isOver = true; } 
                    else { p2Game.gameOver(true); p1Game.isOver = true; }
                    bgmGame.pause(); playWinSfx(); speakVictory();
                }
            }
        }

        let _lastT = 0;
        function gameLoop(now) {
            if(!isRunning) return;
            // dt dipatok 0..50: mencegah dt negatif saat sesi baru dimulai dengan _lastT basi dari sesi sebelumnya
            // (dt negatif membuat guncangan meledak → gambar zombie acak di seluruh layar pada permainan kedua)
            const dt = Math.min(50, Math.max(0, (now || 0) - _lastT));   // ms sejak frame sebelumnya (dibatasi)
            _lastT = now || 0;
            p1Game.update(dt); if(gameMode===2)p2Game.update(dt);
            animId=requestAnimationFrame(gameLoop);
        }
        window.addEventListener('resize', () => { if(p1Game) p1Game.resize(); if(p2Game) p2Game.resize(); });
        window.addEventListener('keydown', (e) => {
            if(!isRunning) return;
            if((e.key>='0'&&e.key<='9')||e.key==='-') if(p1Game) p1Game.inputNum(e.key);
            if(e.key==='Backspace') if(p1Game) p1Game.clearInput();
            if(e.key==='Enter') if(p1Game) p1Game.fire();
        });
        if (!CanvasRenderingContext2D.prototype.roundRect) { CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) { this.rect(x,y,w,h); return this; } }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }
    </script>
